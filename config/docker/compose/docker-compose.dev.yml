version: "3.8"

name: nezuko-admin-dev

services:
  # ===========================================
  # PostgreSQL Database (Shared with Bot)
  # ===========================================
  postgres:
    image: postgres:18-alpine
    container_name: nezuko-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: nezuko
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nezuko_secret}
      POSTGRES_DB: nezuko
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nezuko" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nezuko-dev

  # ===========================================
  # Redis Cache (Shared with Bot)
  # ===========================================
  redis:
    image: redis:8-alpine
    container_name: nezuko-redis-dev
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nezuko-dev

  # ===========================================
  # Admin Panel - Next.js Frontend
  # ===========================================
  web:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.web
    container_name: nezuko-web-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_INSFORGE_BASE_URL=${NEXT_PUBLIC_INSFORGE_BASE_URL}
      - NEXT_PUBLIC_INSFORGE_ANON_KEY=${NEXT_PUBLIC_INSFORGE_ANON_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/node_modules
    networks:
      - nezuko-dev

networks:
  nezuko-dev:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data:
