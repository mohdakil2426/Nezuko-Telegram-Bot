# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — Web Dashboard CI
#
# Triggers on any push/PR that touches the Next.js app.
# Runs all quality gates using Bun.
#
# DEPLOY GATE: Vercel deploys ONLY after this workflow passes.
# Setup: GitHub → Settings → Branches → Branch protection rules → main
#   → "Require status checks to pass" → add "Web Dashboard CI / Quality Gates"
#
# AUTO-FORMAT: If Prettier finds dirty files, CI auto-fixes and commits them
# back to the branch. The push triggers a fresh CI run — which then proceeds
# to all gates clean. No failed builds for formatting mistakes.
# ─────────────────────────────────────────────────────────────────────────────
name: Web Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

env:
  BUN_VERSION: "latest"
  # Stub public env vars so Next.js can compile in CI without real secrets.
  # These are build-time NEXT_PUBLIC_ variables only — no server secrets here.
  NEXT_PUBLIC_INSFORGE_BASE_URL: "https://ci-stub.insforge.app"
  NEXT_PUBLIC_INSFORGE_ANON_KEY: "ci-stub-anon-key"
  NEXT_PUBLIC_USE_MOCK: "false"
  NEXT_PUBLIC_DEV_LOGIN: "false"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Allow the job to push auto-format commits back to the branch.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch full history so we can push commits back.
          fetch-depth: 0
          # Use the GitHub Actions token so auto-format commits trigger CI.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Bun setup ──────────────────────────────────────────────────────────
      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ── Cache node_modules between runs ────────────────────────────────────
      - name: Cache web dependencies
        uses: actions/cache@v5
        id: web-deps-cache
        with:
          path: apps/web/node_modules
          key: web-deps-${{ runner.os }}-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: web-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.web-deps-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # ── Auto-format: Prettier --write → commit if dirty ────────────────────
      # Runs BEFORE the check gates so formatting mistakes are fixed
      # automatically instead of failing CI. The commit triggers a fresh run
      # which proceeds clean through the format:check gate below.
      # Only runs on direct pushes to main (not PRs — PRs should fix locally).
      - name: Auto-format (Prettier)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bun x prettier src --write
          if ! git diff --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format via prettier [skip ci]"
            git push
            echo "FORMATTED=true" >> "$GITHUB_ENV"
          else
            echo "FORMATTED=false" >> "$GITHUB_ENV"
          fi
        working-directory: apps/web

      # ── Gate 1: TypeScript ─────────────────────────────────────────────────
      - name: Type check
        run: bun run type-check

      # ── Gate 2: ESLint ─────────────────────────────────────────────────────
      - name: Lint
        run: bun run lint

      # ── Gate 3: Prettier check ─────────────────────────────────────────────
      # apps/web/.prettierrc includes prettier-plugin-tailwindcss.
      # After the auto-format step this should always be clean on main.
      # On PRs it acts as a strict gate — contributors must format locally.
      - name: Format check
        run: bun x prettier src --check

      # ── Gate 4: Knip (dead-code) ───────────────────────────────────────────
      - name: Knip
        run: bun knip

      # ── Gate 5: Next.js build ──────────────────────────────────────────────
      # Validates RSC boundaries, route types, image config, and all
      # experimental features (PPR, cacheComponents, React Compiler).
      # Uses webpack explicitly to avoid Turbopack resource issues on CI.
      - name: Build (webpack)
        run: bun run build
        env:
          # Turbopack can hit resource limits on Linux CI runners.
          # The webpack build is the canonical correctness check.
          NEXT_TURBOPACK: "0"

      # ── Build status annotation ────────────────────────────────────────────
      - name: CI Summary
        if: success()
        run: |
          echo "### ✅ Web Dashboard CI — All Gates Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| type-check | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| format | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| knip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          if [ -d ".next" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Build size:**" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            du -sh .next/ 2>/dev/null || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggering Vercel deploy..." >> "$GITHUB_STEP_SUMMARY"

  # ── Vercel Deploy — runs ONLY after quality gates pass ──────────────────────
  # Vercel auto-deploy is DISABLED via Ignored Build Step (`exit 1`).
  # This job is the ONLY path that triggers a production deploy.
  # Setup: Vercel Dashboard → Project → Settings → Git → Deploy Hooks
  #   → Create hook → copy URL → GitHub Secrets → VERCEL_DEPLOY_HOOK_URL
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality
    # Only deploy on pushes to main — not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Vercel deploy
        # Override global working-directory (apps/web) — curl hits a URL, no app dir needed.
        working-directory: ${{ github.workspace }}
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "### 🚀 Vercel Deploy Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All quality gates passed — production deploy is in progress." >> "$GITHUB_STEP_SUMMARY"
