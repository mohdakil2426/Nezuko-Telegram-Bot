# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — Web Dashboard CI
#
# Triggers on any push/PR that touches the Next.js app.
# Runs all quality gates using Bun.
#
# DEPLOY GATE: Vercel deploys ONLY after this workflow passes.
# Setup: GitHub → Settings → Branches → Branch protection rules → main
#   → "Require status checks to pass" → add "Web Dashboard CI / Quality Gates"
#
# FORMAT POLICY: CI does not push formatting commits back to the branch.
# Formatting remains a strict gate so the tested SHA always matches the branch SHA.
# ─────────────────────────────────────────────────────────────────────────────
name: Web Dashboard CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

env:
  BUN_VERSION: "1.2.23"
  # Stub public env vars so Next.js can compile in CI without real secrets.
  # These are build-time NEXT_PUBLIC_ variables only — no server secrets here.
  NEXT_PUBLIC_INSFORGE_BASE_URL: "https://ci-stub.insforge.app"
  NEXT_PUBLIC_INSFORGE_ANON_KEY: "ci-stub-anon-key"
  NEXT_PUBLIC_USE_MOCK: "false"
  NEXT_PUBLIC_DEV_LOGIN: "false"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup app toolchain
        uses: ./.github/actions/setup-bun-app
        with:
          app-path: apps/web
          cache-prefix: web-deps
          lockfile-path: apps/web/bun.lock
          bun-version: ${{ env.BUN_VERSION }}

      # ── Gate 1: TypeScript ─────────────────────────────────────────────────
      - name: Type check
        run: bun run type-check

      # ── Gate 2: ESLint ─────────────────────────────────────────────────────
      - name: Lint
        run: bun run lint

      # ── Gate 3: Prettier check ─────────────────────────────────────────────
      # apps/web/.prettierrc includes prettier-plugin-tailwindcss.
      # This is a strict gate on both pushes and PRs — contributors must format locally.
      - name: Format check
        run: bun x prettier src --check

      # ── Gate 4: Knip (dead-code) ───────────────────────────────────────────
      - name: Knip
        run: bun knip

      # ── Gate 5: Next.js build ──────────────────────────────────────────────
      # Validates RSC boundaries, route types, image config, and all
      # experimental features (PPR, cacheComponents, React Compiler).
      # Uses webpack explicitly to avoid Turbopack resource issues on CI.
      - name: Build (webpack)
        run: bun run build
        env:
          # Turbopack can hit resource limits on Linux CI runners.
          # The webpack build is the canonical correctness check.
          NEXT_TURBOPACK: "0"

      # ── Build status annotation ────────────────────────────────────────────
      - name: CI Summary
        if: success()
        run: |
          echo "### ✅ Web Dashboard CI — All Gates Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| type-check | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| format | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| knip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          if [ -d ".next" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Build size:**" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            du -sh .next/ 2>/dev/null || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel deploy job is eligible to run next." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Vercel Deploy — runs ONLY after quality gates pass ──────────────────────
  # Vercel auto-deploy is DISABLED via Ignored Build Step (`exit 1`).
  # This job is the ONLY path that triggers a production deploy.
  # Setup: Vercel Dashboard → Project → Settings → Git → Deploy Hooks
  #   → Create hook → copy URL → GitHub Secrets → VERCEL_DEPLOY_HOOK_URL
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: quality
    permissions: {}
    # Only deploy on pushes to main — not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Vercel deploy
        # Override global working-directory (apps/web) — curl hits a URL, no app dir needed.
        working-directory: ${{ github.workspace }}
        run: |
          response_file="$(mktemp)"
          http_code="$(
            curl --fail-with-body --show-error --silent \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          )"
          echo "Vercel hook response: HTTP $http_code"
          if [ -s "$response_file" ]; then
            echo "Response body:"
            cat "$response_file"
          fi
          echo "### 🚀 Vercel Deploy Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All quality gates passed — production deploy is in progress." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Hook response: \`HTTP $http_code\`" >> "$GITHUB_STEP_SUMMARY"
