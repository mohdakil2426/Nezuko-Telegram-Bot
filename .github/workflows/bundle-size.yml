# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — Next.js Bundle Size Analysis
#
# Captures a lightweight Next.js bundle snapshot on every web push/PR.
#
# What it does:
#   - Builds the Next.js app
#   - Uploads the generated `.next/` directory as a short-lived artifact
#   - Prints the heaviest emitted chunk files into the step summary
#
# What it does NOT do:
#   - comment on PRs
#   - enforce bundle budgets
#   - diff against a historical baseline automatically
# ─────────────────────────────────────────────────────────────────────────────
name: Bundle Size

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/bundle-size.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"

defaults:
  run:
    working-directory: apps/web

env:
  BUN_VERSION: "1.2.23"
  NEXT_PUBLIC_INSFORGE_BASE_URL: "https://ci-stub.insforge.app"
  NEXT_PUBLIC_INSFORGE_ANON_KEY: "ci-stub-anon-key"
  NEXT_PUBLIC_USE_MOCK: "false"
  NEXT_PUBLIC_DEV_LOGIN: "false"

jobs:
  bundle:
    name: Analyze Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup app toolchain
        uses: ./.github/actions/setup-bun-app
        with:
          app-path: apps/web
          cache-prefix: web-deps
          lockfile-path: apps/web/bun.lock
          bun-version: ${{ env.BUN_VERSION }}

      # ── Build and capture bundle stats ─────────────────────────────────────
      - name: Build Next.js (webpack, with bundle stats)
        run: bun run build
        env:
          NEXT_TURBOPACK: "0"
          # Tell Next.js to emit build stats for analysis
          ANALYZE: "false"

      # ── Upload .next output as a short-lived artifact ──────────────────────
      - name: Upload bundle stats
        uses: actions/upload-artifact@v7
        with:
          name: bundle-stats-${{ github.sha }}
          path: apps/web/.next/
          retention-days: 30
          if-no-files-found: warn

      # ── Print page sizes to step summary ───────────────────────────────────
      - name: Bundle size summary
        run: |
          echo "### 📦 Next.js Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f ".next/build-manifest.json" ]; then
            echo "**Build output sizes:**" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            # Show top-level .next dir sizes
            du -sh .next/static/chunks/*.js 2>/dev/null | sort -rh | head -20 || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Total .next size:**" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            du -sh .next/ 2>/dev/null || true
            du -sh .next/static/ 2>/dev/null || true
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ build-manifest.json not found." >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: apps/web
