# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — Release Please
#
# Automatically:
#   1. Parses conventional commits on main
#   2. Opens/updates a "Release PR" with CHANGELOG.md and version bumps
#   3. When you merge the Release PR → creates a GitHub Release + git tag
#
# Conventional commits that trigger releases:
#   feat:     → minor version bump (0.x.0)
#   fix:      → patch version bump (0.0.x)
#   feat!:    → major version bump (x.0.0) [breaking change]
#   chore,ci,docs,style,refactor,test → no version bump (appear in changelog)
#
# Monorepo: grammy (apps/grammy) and web (apps/web) are versioned independently.
#
# PREREQUISITE: Repo must have "Allow GitHub Actions to create and approve
# pull requests" enabled:
#   Settings → Actions → General → Workflow permissions → ☑ enable → Save
# ─────────────────────────────────────────────────────────────────────────────
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write # Create releases and tags
  pull-requests: write # Open and update release PRs

env:
  # googleapis/release-please-action@v4 runs on Node.js 20 (deprecated Jun 2026).
  # This opts into Node.js 24 now, silencing the deprecation warning.
  # Remove this line once a Node.js 24-native release-please-action is published.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@v4.4.0
        with:
          # Token with write permissions for releases + PRs
          token: ${{ secrets.GITHUB_TOKEN }}
          # Config files defined below (release-please-config.json)
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
