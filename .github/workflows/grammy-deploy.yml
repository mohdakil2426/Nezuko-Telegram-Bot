# ─────────────────────────────────────────────────────────────────────────────
# NOTE: This workflow is ARCHIVED — no longer used.
#
# The grammY bot now deploys via DigitalOcean App Platform.
# App Platform deploys automatically on every push to main.
# See .do/app.yaml for the App Platform spec.
#
# This file is kept for reference only (Droplet-style SSH deploy pattern).
# It can be deleted if you never plan to switch back to a Droplet.
# ─────────────────────────────────────────────────────────────────────────────
name: grammY Bot Deploy (Archived - App Platform Used Instead)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "This workflow is archived. Type 'yes' to run anyway (Droplet fallback only)"
        required: true
        default: "no"

jobs:
  archived:
    name: Archived
    runs-on: ubuntu-latest
    steps:
      - name: Remind about App Platform
        run: |
          echo "⚠️  This workflow is archived."
          echo "The bot deploys automatically via DigitalOcean App Platform."
          echo "See .do/app.yaml for the current deploy spec."
          exit 1
