# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — grammY Bot CI
#
# Triggers on any push/PR that touches the bot source or its tests.
# Runs all quality gates using Bun (the canonical runtime for this project).
# On main-branch pushes it additionally produces a build artifact that the
# deploy workflow can consume without re-building.
# ─────────────────────────────────────────────────────────────────────────────
name: grammY Bot CI

on:
  push:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - "tests/grammy/**"
      - ".github/workflows/grammy-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - "tests/grammy/**"
      - ".github/workflows/grammy-ci.yml"

concurrency:
  # Cancel in-progress runs on the same branch/PR so stale jobs don't queue up.
  group: grammy-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/grammy

env:
  BUN_VERSION: "latest"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Bun setup ──────────────────────────────────────────────────────────
      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ── Cache node_modules between runs ────────────────────────────────────
      - name: Cache grammy dependencies
        uses: actions/cache@v4
        id: grammy-deps-cache
        with:
          path: apps/grammy/node_modules
          key: grammy-deps-${{ runner.os }}-${{ hashFiles('apps/grammy/bun.lock') }}
          restore-keys: grammy-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.grammy-deps-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # ── Gate 1: TypeScript ─────────────────────────────────────────────────
      - name: Type check
        run: bun run type-check

      # ── Gate 2: ESLint ─────────────────────────────────────────────────────
      - name: Lint
        run: bun run lint

      # ── Gate 3: Prettier ───────────────────────────────────────────────────
      # Both src/ AND tests/grammy/ are in scope (root .prettierrc, no tailwind plugin).
      - name: Format check
        run: bun run format:check

      # ── Gate 4: Knip (dead-code) ───────────────────────────────────────────
      - name: Knip
        run: bun run knip

      # ── Gate 5: Tests ──────────────────────────────────────────────────────
      - name: Tests
        run: bun run test

      # ── Gate 6: Build ──────────────────────────────────────────────────────
      - name: Build
        run: bun run build

      # ── Upload build artifact (main branch only) ───────────────────────────
      # The deploy workflow downloads this artifact instead of re-building.
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: grammy-dist-${{ github.sha }}
          path: |
            apps/grammy/dist/
            apps/grammy/package.json
            apps/grammy/bun.lock
          retention-days: 7
          if-no-files-found: error
