# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — grammY Bot CI
#
# Runs all quality gates on every push/PR that touches the bot.
# App Platform deploys automatically from GitHub on push to main.
#
# DEPLOY GATE: To gate App Platform deploys on CI:
#   GitHub → Settings → Branches → Add rule → main
#   → "Require status checks to pass" → add "grammY Bot CI / Quality Gates"
#
# AUTO-FORMAT: If Prettier finds dirty files, CI auto-fixes and commits them
# back. No failed builds for formatting mistakes.
# ─────────────────────────────────────────────────────────────────────────────
name: grammY Bot CI

on:
  push:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - ".github/workflows/grammy-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - ".github/workflows/grammy-ci.yml"

concurrency:
  group: grammy-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/grammy

env:
  BUN_VERSION: "latest"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Allow the job to push auto-format commits back to the branch.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Bun setup ──────────────────────────────────────────────────────────
      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ── Cache node_modules ─────────────────────────────────────────────────
      - name: Cache grammy dependencies
        uses: actions/cache@v5
        id: grammy-deps-cache
        with:
          path: apps/grammy/node_modules
          key: grammy-deps-${{ runner.os }}-${{ hashFiles('apps/grammy/bun.lock') }}
          restore-keys: grammy-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.grammy-deps-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # ── Auto-fix: Prettier + ESLint → single commit if dirty ───────────────
      # What gets auto-fixed:
      #   ✅ Prettier  → bun run format (src/ + tests/)
      #   ✅ ESLint    → eslint src --fix (fixable rule violations)
      # What is NOT auto-fixed (requires manual fix + re-push):
      #   ❌ TypeScript errors  → type-check gate will fail
      #   ❌ Unfixable lint     → lint gate will fail after --fix
      #   ❌ Build / test errors → build/test gates will fail
      # Only runs on direct pushes to main (PRs should fix locally).
      - name: Auto-fix (Prettier + ESLint)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          FIXED_TOOLS=""

          # 1. Prettier (root .prettierrc, covers src/ + tests/)
          bun run format
          if ! git diff --quiet; then
            FIXED_TOOLS="prettier"
          fi

          # 2. ESLint --fix (ignore exit code — unfixable issues handled by lint gate)
          bun x eslint src --fix --max-warnings 9999 || true
          if ! git diff --quiet && [[ "$FIXED_TOOLS" != *"eslint"* ]]; then
            FIXED_TOOLS="${FIXED_TOOLS:+$FIXED_TOOLS, }eslint"
          fi

          # Commit all auto-fixes in one go
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix(ci): auto-fix code quality [${FIXED_TOOLS}] [skip ci]"
            git push
            echo "AUTO_FIXED=true" >> "$GITHUB_ENV"
            echo "FIXED_TOOLS=$FIXED_TOOLS" >> "$GITHUB_ENV"
          else
            echo "AUTO_FIXED=false" >> "$GITHUB_ENV"
          fi

      # ── Gate 1: TypeScript ─────────────────────────────────────────────────
      - name: Type check
        run: bun run type-check

      # ── Gate 2: ESLint ─────────────────────────────────────────────────────
      - name: Lint
        run: bun run lint

      # ── Gate 3: Prettier ───────────────────────────────────────────────────
      - name: Format check
        run: bun run format:check

      # ── Gate 4: Knip (dead-code) ───────────────────────────────────────────
      - name: Knip
        run: bun run knip

      # ── Gate 5: Tests ─────────────────────────────────────────────────────
      - name: Test
        run: bun run test

      # ── Gate 6: Build ─────────────────────────────────────────────────────
      # Validates the TypeScript compiles to dist/ with zero errors.
      # App Platform will run this same build inside the Docker image.
      - name: Build
        run: bun run build

      # ── Docker build validation ────────────────────────────────────────────
      # Build the Dockerfile locally to catch container build failures before
      # they reach App Platform (saves ~3min of wasted deploy time).
      - name: Validate Dockerfile builds
        working-directory: .
        run: |
          docker build \
            -f apps/grammy/Dockerfile \
            -t nezuko-grammy-ci:${{ github.sha }} \
            apps/grammy/
          echo "Docker build succeeded ✓"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print CI summary
        if: success()
        run: |
          echo "### ✅ grammY Bot CI — All Gates Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| type-check | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| format | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| knip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| test | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| docker | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "App Platform will auto-deploy from this commit." >> "$GITHUB_STEP_SUMMARY"
