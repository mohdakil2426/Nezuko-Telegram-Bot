# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — grammY Bot CI
#
# Runs all quality gates on every push/PR that touches the bot.
# App Platform deploys automatically from GitHub on push to main —
# this workflow is the mandatory pre-gate that must pass first.
#
# To gate App Platform deploys on CI:
#   GitHub → Settings → Branches → Add rule → main
#   → "Require status checks to pass" → add "grammY Bot CI / quality"
# ─────────────────────────────────────────────────────────────────────────────
name: grammY Bot CI

on:
  push:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - "tests/grammy/**"
      - ".github/workflows/grammy-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - "tests/grammy/**"
      - ".github/workflows/grammy-ci.yml"

concurrency:
  group: grammy-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/grammy

env:
  BUN_VERSION: "latest"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── Bun setup ──────────────────────────────────────────────────────────
      - name: Setup Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ── Cache node_modules ─────────────────────────────────────────────────
      - name: Cache grammy dependencies
        uses: actions/cache@v5
        id: grammy-deps-cache
        with:
          path: apps/grammy/node_modules
          key: grammy-deps-${{ runner.os }}-${{ hashFiles('apps/grammy/bun.lock') }}
          restore-keys: grammy-deps-${{ runner.os }}-

      - name: Install dependencies
        if: steps.grammy-deps-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # ── Gate 1: TypeScript ─────────────────────────────────────────────────
      - name: Type check
        run: bun run type-check

      # ── Gate 2: ESLint ─────────────────────────────────────────────────────
      - name: Lint
        run: bun run lint

      # ── Gate 3: Prettier ───────────────────────────────────────────────────
      - name: Format check
        run: bun run format:check

      # ── Gate 4: Knip (dead-code) ───────────────────────────────────────────
      - name: Knip
        run: bun run knip

      # ── Gate 5: Tests ─────────────────────────────────────────────────────
      - name: Test
        run: bun run test

      # ── Gate 6: Build ─────────────────────────────────────────────────────
      # Validates the TypeScript compiles to dist/ with zero errors.
      # App Platform will run this same build inside the Docker image.
      - name: Build
        run: bun run build

      # ── Docker build validation ────────────────────────────────────────────
      # Build the Dockerfile locally to catch container build failures before
      # they reach App Platform (saves ~3min of wasted deploy time).
      - name: Validate Dockerfile builds
        working-directory: .
        run: |
          docker build \
            -f apps/grammy/Dockerfile \
            -t nezuko-grammy-ci:${{ github.sha }} \
            apps/grammy/
          echo "Docker build succeeded ✓"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print CI summary
        if: success()
        run: |
          echo "### ✅ grammY Bot CI — All Gates Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| type-check | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| format | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| knip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| test | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| docker | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "App Platform will auto-deploy from this commit." >> "$GITHUB_STEP_SUMMARY"
