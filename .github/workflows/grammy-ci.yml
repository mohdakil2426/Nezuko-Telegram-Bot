# ─────────────────────────────────────────────────────────────────────────────
# Nezuko — grammY Bot CI
#
# Runs all quality gates on every push/PR that touches the bot.
# App Platform deploys automatically from GitHub on push to main.
#
# DEPLOY GATE: To gate App Platform deploys on CI:
#   GitHub → Settings → Branches → Add rule → main
#   → "Require status checks to pass" → add "grammY Bot CI / Quality Gates"
#
# FORMAT POLICY: CI does not push formatting commits back to the branch.
# Formatting remains a strict gate so the tested SHA always matches the branch SHA.
# ─────────────────────────────────────────────────────────────────────────────
name: grammY Bot CI

on:
  push:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - ".github/workflows/grammy-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/grammy/**"
      - ".github/workflows/grammy-ci.yml"

concurrency:
  group: grammy-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/grammy

env:
  BUN_VERSION: "1.2.23"

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup app toolchain
        uses: ./.github/actions/setup-bun-app
        with:
          app-path: apps/grammy
          cache-prefix: grammy-deps
          lockfile-path: apps/grammy/bun.lock
          bun-version: ${{ env.BUN_VERSION }}

      # ── Gate 1: TypeScript ─────────────────────────────────────────────────
      - name: Type check
        run: bun run type-check

      # ── Gate 2: ESLint ─────────────────────────────────────────────────────
      - name: Lint
        run: bun run lint

      # ── Gate 3: Prettier ───────────────────────────────────────────────────
      - name: Format check
        run: bun run format:check

      # ── Gate 4: Knip (dead-code) ───────────────────────────────────────────
      - name: Knip
        run: bun run knip

      # ── Gate 5: Tests ─────────────────────────────────────────────────────
      - name: Test
        run: bun run test

      # ── Gate 6: Build ─────────────────────────────────────────────────────
      # Validates the TypeScript compiles to dist/ with zero errors.
      # App Platform will run this same build inside the Docker image.
      - name: Build
        run: bun run build

      # ── Docker build validation ────────────────────────────────────────────
      # Build the Dockerfile locally to catch container build failures before
      # they reach App Platform (saves ~3min of wasted deploy time).
      - name: Validate Dockerfile builds
        working-directory: .
        run: |
          docker build \
            -f apps/grammy/Dockerfile \
            -t nezuko-grammy-ci:${{ github.sha }} \
            apps/grammy/
          echo "Docker build succeeded ✓"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print CI summary
        if: success()
        run: |
          echo "### ✅ grammY Bot CI — All Gates Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| type-check | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| lint | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| format | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| knip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| test | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| docker | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "App Platform will auto-deploy from this commit." >> "$GITHUB_STEP_SUMMARY"
