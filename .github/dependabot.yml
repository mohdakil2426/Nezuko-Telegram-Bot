# ─────────────────────────────────────────────────────────────────────────────
# Dependabot — Automated dependency security & version updates
#
# Groups updates to reduce PR noise:
#   - patch + minor: combined weekly (safe, low-risk)
#   - major: separate PR per package (needs manual review)
# ─────────────────────────────────────────────────────────────────────────────
version: 2

updates:
  # ── Web dashboard (apps/web) ──────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "web"
    groups:
      # Patch + minor updates in one PR — safe to auto-merge
      web-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # Major updates separately — needs review
      web-major:
        applies-to: version-updates
        update-types:
          - "major"
    # Security updates are always individual PRs (GitHub default)
    open-pull-requests-limit: 10

  # ── grammY bot (apps/grammy) ─────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/grammy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "bot"
    groups:
      grammy-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      grammy-major:
        applies-to: version-updates
        update-types:
          - "major"
    open-pull-requests-limit: 10

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-all:
        applies-to: version-updates
        update-types:
          - "major"
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
