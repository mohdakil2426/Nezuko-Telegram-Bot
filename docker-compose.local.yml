version: '3.8'

services:
  # ==========================================================
  # PostgreSQL Database (Local Development)
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    container_name: nezuko-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: nezuko
      POSTGRES_PASSWORD: nezuko123
      POSTGRES_DB: nezuko
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nezuko -d nezuko"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Redis Cache (Local Development)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: nezuko-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data-local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-local:
  redis-data-local:
